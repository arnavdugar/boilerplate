services:
  chartdb:
    image: ${CHARTDB_VIEWER_IMAGE:-ghcr.io/arnavdugar/chartdb-viewer:latest}
    profiles: [developer-tools]
    environment:
      SCHEMA_DIALECT: postgresql
    ports:
      - "127.0.0.1:3003:80"
    volumes:
      - ./api:/schema:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:80/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9.17
    profiles: [developer-tools]
    ports:
      - "127.0.0.1:3002:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: app@example.com
      PGADMIN_DEFAULT_PASSWORD: app
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_DISABLE_POSTFIX: "1"
      PGPASS_FILE: /config/pgpass
    depends_on:
      postgres:
        condition: service_healthy
    configs:
      - source: pgadmin_servers
        target: /pgadmin4/servers.json
      - source: pgadmin_pgpass
        target: /config/pgpass
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:80/misc/ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  scalar:
    image: scalarapi/api-reference:0.5.65
    profiles: [developer-tools]
    ports:
      - "3001:8080"
    environment:
      API_REFERENCE_CONFIG: |
        {
          "agent": {"disabled": true},
          "servers": [{"url": "http://localhost:3000"}]
        }
    volumes:
      - ./schema/openapi.yaml:/docs/openapi.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3mock:
    image: adobe/s3mock:5.1.0
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: app
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./s3mock-data:/s3mockroot
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9090/favicon.ico"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgadmin_data:
  postgres_data:

configs:
  pgadmin_servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "Local Postgres",
            "Group": "Servers",
            "Host": "postgres",
            "Port": 5432,
            "MaintenanceDB": "app",
            "Username": "app",
            "SSLMode": "disable",
            "PassFile": "/var/lib/pgadmin/.pgpass"
          }
        }
      }
  pgadmin_pgpass:
    content: |
      postgres:5432:*:app:app
